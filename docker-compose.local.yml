version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rubato-db-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
      POSTGRES_DB: rubato_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
      - ./backend/database/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rubato-backend-local
    ports:
      - "5001:5000"
    env_file:
      - .env.docker
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata_local:
